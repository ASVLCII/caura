# Claude Code Review
#
# Runs automatically when a PR is opened/reopened by a member of the
# ``caura-ai`` organization. Re-trigger after pushing changes by
# commenting "@claude" on the PR (also restricted to org members).
#
# Why org-only: this workflow consumes ``ANTHROPIC_API_KEY`` and burns
# real budget per review. ``pull_request`` events from forks don't
# receive secrets anyway (GitHub strips them); restricting to org
# members makes the policy explicit and stops fork PRs from triggering
# silent-failure runs.
#
# Membership is read from the event payload's ``author_association``,
# accepting ``MEMBER`` and ``OWNER``. Both the on-open review and the
# ``@claude`` retrigger use that one field, so the two paths cannot
# disagree about who counts as a member.
#
# This is a correction. The gate previously called
# ``orgs/caura-ai/members/{user}`` at runtime, on the belief that
# ``author_association`` reported ``NONE`` for members whose org
# membership is private. It does not — a private member reports
# ``MEMBER``, verified on live payloads here. The API call, meanwhile,
# answers for its caller, and ``GITHUB_TOKEN`` sees only PUBLIC members:
# it returned 404 for every maintainer, so the on-open review was skipped
# on every human pull request while retriggers kept working. Requiring
# public org membership to get a code review was not a deliberate policy;
# it was a consequence of that wrong belief.
#
# What the payload field genuinely costs: it is computed when the event
# fires, not when the review runs, so a member removed from the org in
# between is still honoured. Reopening a pull request recomputes it.

name: Claude Code Review

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  EXTRA_PROMPT: "This is a FastAPI + PostgreSQL (pgvector) backend with a TypeScript OpenClaw plugin. Uses requirements.txt (not uv/pyproject.toml). Tests are in tests/ directory."
  REVIEW_PROMPT: |
    Do NOT review files under tests/ or test_* files. Focus only on source code.

    Review this PR for real issues only — not style preferences.

    ## Format

    For each issue:

    ### Issue Title
    **Severity**: Critical/High/Medium/Low
    **File**: `path/to/file.py:line-range`
    **Problem**: One sentence.

    <details>
    <summary>🤖 Claude Code Prompt</summary>

    ```
    [Self-contained prompt with exact file paths, line numbers, what to change and why]
    ```

    </details>

    ---

    ## Sections
    1. **Summary**: 2-3 sentences
    2. **Critical/High Issues**: Must fix before merge
    3. **Medium/Low Issues**: Should fix, not blocking
    4. **Suggestions**: Nice-to-have
    Skip empty sections.

    ## 🚀 Fix All Prompts
    At the end, add one "Fix All" code block per severity level that has issues (🔴 Critical, 🟠 High, 🟡 Medium/Low, 🟢 Suggestions). Each block combines all prompts from that level.

jobs:
  pre-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Evaluate skip conditions
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_FILES: "30"
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_ACTOR: ${{ github.actor }}
          PR_AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # 1. Org membership gate, read from the event payload's
          # ``author_association`` — the same field, and the same accepted
          # values, as the ``claude-retrigger`` job. One mechanism for one
          # policy: two ways of deciding "is this an org member" is exactly
          # the drift this pipeline exists to remove.
          #
          # This replaces a runtime ``orgs/{org}/members/{user}`` call that
          # silently disabled the on-open review entirely. That endpoint
          # answers for the CALLER: with ``GITHUB_TOKEN`` it sees only PUBLIC
          # members, returning 404 for a private member exactly as for a
          # stranger. Every maintainer's caura-ai membership is private, so
          # rule 1 skipped every human pull request — while ``@claude``
          # retriggers kept working, because that path already used
          # ``author_association``. Verified on live payloads in this repo:
          # private members report ``MEMBER``, and an outside contributor
          # reports ``FIRST_TIME_CONTRIBUTOR``, so the field still
          # discriminates. The comment this replaces claimed private members
          # surface as ``NONE``; that is not what GitHub does.
          #
          # ``COLLABORATOR`` stays excluded, as in claude-retrigger: the
          # policy is "members of our org", which is stricter than repo
          # write access. Bots are not ``MEMBER`` either, so they remain
          # skipped here regardless of rule 4.
          #
          # The trade, stated: this field is computed when the event fires,
          # so it reflects membership at that moment rather than at review
          # time — a member removed from the org between opening a pull
          # request and the review running would still be honoured. The
          # rejected alternative reflected review time but did not work at
          # all, and retrigger already accepts this same trade.
          if [[ ! "${PR_AUTHOR_ASSOC:-}" =~ ^(MEMBER|OWNER)$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=PR author '${PR_ACTOR}' is not a caura-ai org member (author_association: ${PR_AUTHOR_ASSOC:-unset})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Skip synchronize events (push to PR branch) — use @claude to re-trigger
          if [[ "$PR_ACTION" == "synchronize" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=push to PR branch (synchronize) — comment @claude to re-trigger" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Skip draft PRs
          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=draft PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. Skip bot PRs
          if [[ "$PR_ACTOR" == "dependabot[bot]" || "$PR_ACTOR" == "renovate[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=bot PR ($PR_ACTOR)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 5. Too many changed files
          FILE_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq 'length')
          if [[ "$FILE_COUNT" -gt "$MAX_FILES" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=PR has ${FILE_COUNT} files (limit: ${MAX_FILES})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 6. Only test/config/docs files changed — no source to review
          SRC_FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '[.[] | select(.filename | (startswith("tests/") or startswith("test_") or test("^(Dockerfile|helm/|docs/|.*\\.(md|toml|lock|ya?ml)$)")) | not)] | length')
          if [[ "$SRC_FILES" -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no source files to review (only tests/docs/config)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"

      - name: Log skip reason
        if: steps.decide.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "::notice::Skipping Claude review — $REASON"
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="**Claude Code Review** — skipped: ${REASON}" 2>/dev/null || true

  # Runs on PR opened/reopened — reviews the diff via the shared script.
  # Gated on org membership transitively through ``pre-checks``: when
  # ``pre-checks`` skips a non-member PR, ``needs.pre-checks.result``
  # is ``'skipped'`` (not ``'success'``), so the ``== 'success'`` clause
  # below already short-circuits this job. Don't re-check
  # ``author_association`` here — keeping the gate in one place avoids
  # the two conditions drifting out of sync.
  claude-review:
    needs: pre-checks
    if: >-
      github.event_name == 'pull_request'
      && needs.pre-checks.result == 'success'
      && needs.pre-checks.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Checks out the PR merge ref, so the review runs THIS PR's version of the
      # review script (lets a workflow/script change self-test on its own PR).
      # Secrets are withheld from fork-PR runs and pre-checks gate the rest.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.159 # pinned: reproducible reviews; bump deliberately

      # Same script as the @claude retrigger job below — feed the real diff to
      # `claude --print`. Replaces the claude-code-action agent, which never
      # received the diff (it tried `gh`, hit the headless permission wall) and
      # produced an empty result that got stamped "No issues found".
      - name: Review PR diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXTRA_PROMPT: ${{ env.EXTRA_PROMPT }}
          REVIEW_PROMPT: ${{ env.REVIEW_PROMPT }}
        run: bash .github/scripts/claude_pr_review.sh

  # Runs on @claude comment — only for public org members (MEMBER or OWNER).
  claude-retrigger:
    # Hardening: gate at the job level on author_association so the runner never
    # even starts for a non-member's @claude comment. The step-level "Check
    # commenter is org member" below still re-validates and sets the
    # ``authorized`` output for defense-in-depth — both read the same
    # ``author_association`` field, so the two conditions cannot disagree.
    if: >-
      github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["MEMBER", "OWNER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check commenter is org member
        id: auth
        env:
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # ``author_association`` is set by GitHub on the event payload
          # and reflects the commenter's relationship to the repo's
          # owner organization. ``MEMBER`` = org member, ``OWNER`` = org
          # owner. Membership VISIBILITY does not affect it: a private
          # member reports ``MEMBER``, verified on live payloads in this
          # repo. (An earlier version of this comment claimed private
          # members surface as ``NONE``. They do not, and that claim is
          # what pushed the on-open review onto an API call that could
          # not see private members at all.)
          #
          # ``COLLABORATOR`` (non-org members granted direct repo write
          # access via Settings → Collaborators) is INTENTIONALLY
          # excluded — the policy is "members of our org only", which
          # is stricter than the previous ``write``/``admin`` permission
          # check. If a future operator wants to widen this, do it
          # explicitly; do not "fix" it back as a presumed bug.
          case "$AUTHOR_ASSOC" in
            MEMBER|OWNER)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "::notice::@claude triggered by ${COMMENTER} (author_association: ${AUTHOR_ASSOC}) — skipping, org membership required"
              ;;
          esac

      - name: Get PR details
        if: steps.auth.outputs.authorized == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          REPO=${{ github.repository }}

          # Verify this is a PR comment, not an issue comment
          HTTP_CODE=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.number' 2>/dev/null) || {
            echo "Not a PR comment, skipping"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo "is_pr=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # Check out the BASE repo's default branch — deliberately NOT the PR/fork
      # code. This job runs on ``issue_comment``, which (unlike fork
      # ``pull_request`` events) DOES receive repo secrets (ANTHROPIC_API_KEY, a
      # write GH_TOKEN). The review script below is fetched from trusted base
      # code and pulls the PR diff via the GitHub API, so a malicious fork can
      # never get its code executed with our secrets. This also fixes the old
      # failure: the previous ``ref: <head_ref>`` pointed at the fork's branch,
      # which doesn't exist in the base repo, so checkout exited 1 (.github#111).
      - name: Checkout base repo (trusted review script)
        if: steps.auth.outputs.authorized == 'true' && steps.pr.outputs.is_pr == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Claude CLI
        if: steps.auth.outputs.authorized == 'true' && steps.pr.outputs.is_pr == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.159 # pinned: reproducible reviews; bump deliberately

      # Same script as the on-open claude-review job above.
      - name: Review PR diff
        if: steps.auth.outputs.authorized == 'true' && steps.pr.outputs.is_pr == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EXTRA_PROMPT: ${{ env.EXTRA_PROMPT }}
          REVIEW_PROMPT: ${{ env.REVIEW_PROMPT }}
        run: bash .github/scripts/claude_pr_review.sh
