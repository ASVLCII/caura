# Claude Code Review — thin caller for the org's shared pipeline.
#
# The jobs, the scripts, and the review prompt all live in caura-ai/.github. This
# file keeps only what GitHub requires here (a reusable workflow cannot declare
# its own triggers) and what is genuinely specific to this repo: the blurb that
# tells the reviewer what it is looking at.
#
# It replaces a local copy of the whole pipeline plus its own copy of the review
# script. See caura-ai/.github for why the pipeline is shared and what it does.

name: Claude Code Review

on:
  pull_request:
    branches: [main, dev]
    # `closed` is new here, added to feed claude-capture on merge; the shared
    # workflow is what keeps it from also triggering a fresh review.
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]
  # Backfill for claude-capture on a PR that merged before the job existed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to capture declined findings from"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

# The cost and noise gates the local pre-checks job enforced were not dropped —
# every one of them now lives in the callee, and none needs a knob here:
#
#   synchronize  skipped, so a push never costs a review; log-only, so it does
#                not comment either. Re-trigger with an explicit comment.
#   draft PRs    skipped
#   bot PRs      dependabot[bot] and renovate[bot] skipped, matched on the actor
#                rather than the PR author so a bot's rebase synchronize is
#                covered too. The skip note is posted best-effort (`|| true`), so
#                a bot PR's read-only token cannot turn the check red.
#   max-files    the shared default is 30 — the value this repo already used
#   docs-only    this repo's filter was already the org default, so it is inherited
#   org gate     ACTIVE here, and the reason nothing is passed for it: the callee's
#                author-gate defaults to `auto`, which reads the repo's visibility
#                and enables the gate on public repos. This is the only public repo
#                in the org, so this is the only caller where it fires. It replaces
#                the local runtime membership check this file used to carry, whose
#                rationale was that a review burns real budget and fork PRs should
#                not be able to spend it. Deriving it from visibility rather than
#                passing a flag is deliberate: a repo that goes public gets the gate
#                without anyone remembering to set anything.
#
#                Consequence worth knowing, unchanged from before: the check asks
#                orgs/{org}/members/{user}, which GITHUB_TOKEN can only answer for
#                PUBLIC members, so a maintainer whose org membership is private
#                sees their own PR skipped and re-triggers the review by comment.
#   authz        the comment-driven commands are still gated on the commenter
#                having write access; the callee asks the collaborators
#                permission API, which is stricter than the author_association
#                test this file used to do
#   cli version  the callee pins @anthropic-ai/claude-code to 2.1.159, the exact
#                version this repo pinned
#
# Recorded explicitly because these guards are no longer visible in this file and
# the next reader should not re-add them to the caller's `if:`. The shared copy
# also fixes a bug all seven local copies had: /files defaults to per_page=30, so
# a PR with 30 or more changed files reported exactly 30, `30 -gt 30` was false,
# and the oversized-PR guard never fired for the PRs it existed to catch.

jobs:
  claude-code-review:
    # Without a gate, every comment anywhere in the repo — including on plain
    # issues — dispatches the shared workflow, whose jobs then all skip. The run
    # is created either way, but the caller job itself succeeds, so an unrelated
    # issue comment leaves a green Claude Code Review check behind it.
    #
    # Filtered on "is this comment on a pull request", deliberately, rather than
    # on `@claude` or `/remember`: naming the commands here would copy the
    # callee's trigger conditions into every caller and reintroduce exactly the
    # drift this migration removes. The shared workflow still gates each command
    # itself; this only declines to forward comments the pipeline can never act
    # on, which is the part that is stable.
    if: >-
      github.event_name != 'issue_comment'
      || github.event.issue.pull_request != null
    # Deliberately @main rather than a SHA. Pinning only this line would be false
    # assurance: the reusable workflow references its own composite action at
    # @main internally, so the scripts that actually run the review would still
    # float while this reference looked pinned. The fix is coordinated @v1 tags
    # moving the workflow and the action together, tracked in caura-ai/.github;
    # this line moves to @v1 once they exist.
    uses: caura-ai/.github/.github/workflows/claude-code-review.yml@main
    with:
      extra-prompt: "This is a FastAPI + PostgreSQL (pgvector) backend with a TypeScript OpenClaw plugin. Uses requirements.txt (not uv/pyproject.toml). Tests are in tests/ directory."
      # Only populated on workflow_dispatch. On the other triggers `inputs` is
      # empty, so this resolves to '' — which the callee declares as
      # `type: string, default: ''`, making an explicit '' identical to omitting
      # the key. (Worth stating because a reusable workflow applies a default
      # only when the caller omits the key; had the callee typed this `number`,
      # passing '' would fail every PR.)
      pr-number: ${{ inputs.pr_number }}
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      # New to this repo, and deliberately allowed to be absent: an undefined
      # secret interpolates to '' rather than failing the run, and the review
      # script guards on `-n`, so until MEMCLAW_AGENTS_KEY exists as an org secret
      # the review-memory halves are skipped and the review is byte-for-byte
      # unchanged. Today it is a repo secret on caura-ops only.
      memclaw-agents-key: ${{ secrets.MEMCLAW_AGENTS_KEY }}
